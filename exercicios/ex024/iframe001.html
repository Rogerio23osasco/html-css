<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estutos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do  
        <!--tamanho padrão de um iframe  é de 300x150 px-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500">
            <a href="https://www.cursoemvideo.com/" target="_blank"> Curso em Video</a>
        </iframe>
        
        para aprender a programar.</p>

    <p> meu Repositório do <iframe src="https://rogerio23osasco.github.io/html-css/" frameborder="0" height="500" width="500">
        <a href="https://rogerio23osasco.github.io/html-css/" target="_blank">no Github</a>
    </iframe> é bem legal e funciona dentro do iframe</p>
</body>
</html>
