<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
          /*quando for centralizar verticalmente tem que ter a presença de um container e de um conteúdo.
          coloque uma posicão "relative" no container, já o conteúdo entra na posição "absolute". Quando se coloca um elemento na posição "absolute", pode-se adicionar duas propriedades: top e left usando também o "transform" com "translate" */
        section#container{
                background-image: url('imagens/target001.png');
                background-size: 100% 100%;
                position: relative; 
                height: 500px;
                background-color: purple;
                padding: 10px;
                position: relative;
        }

        article#conteudo {
                background-image: url('imagens/target001.png');
                background-size: 100% 100%;
                position: absolute;
                height: 200px;
                width: 500px;
                background-color: yellow;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
