<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        h1{/* box-level */
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 10px solid darkgray;

            padding: 10px;

            margin: 10px auto 10px auto;

            outline: 5px dashed blue;
        }

        a{/* inline-level */
            background-color: lightgray;

            border: 10px solid darkred;

            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplos de Box-level</h1>
     <p>Paragráfos também são exemplos de box-level, mas os <a href="#"> links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.
    </p>
</body>
</html>
