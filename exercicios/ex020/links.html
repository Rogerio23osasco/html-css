<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* Seletores Personalizados
        #  = Id
        .  = Classe
        :  = Pseudo-classe
        :: = Pseudo-elemento
        >  = Seleciona o elemento filho ou children  
         */
        body{
            font-family:Arial, Helvetica, sans-serif;
            
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }
        a:hover{
            text-decoration: underline;
            color:blueviolet;
        }

        a:active{
            color: green;
        }

        a::before{
            content: '← ';
             text-decoration: none;
            font-weight: normal; 
            color: gray;
        }

        a::after{
            content: " →";
            text-decoration: none;
            font-weight: normal; 
            color: gray;
        }

    </style>    
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
       <li><a href="https://github.com/Rogerio23osasco" target="_blank">Repositório GitHub</a></li>
       <li><a href="https://www.youtube.com/@DespertSeuPotencial" target="_blank">Canal do YouTube</a></li>
       <li><a href="https://www.linkedin.com/in/rogerio-silva-23osasco" target="_blank">Perfil no LinkedIn</a></li>
    </ul>
</body>
</html>
