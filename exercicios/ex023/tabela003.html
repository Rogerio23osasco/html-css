<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 300px;
        }

        td{
            border: 1px solid black;
            padding: 12px;
            text-align: center;

        }


    </style>
</head>
<body>
    <h1>Mesclagens de Células</h1>
    <table>
        <tr><!--linhas-->
            <td>A</td><!--células-->
            <td colspan="2">B</td><!-- colspan / mescla Colunas-->
            
        </tr>
        <tr>
            <td rowspan="3">D</td><!--rowspan / mescla linha-->
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>
            <!--<td>G</td>células-->
            <td>H</td>
            <!--<td>I</td>-->
        </tr>
        <tr>
            <!--<td>J</td>células-->
            <td colspan="2">K</td>
            <!--<td>L</td>-->
        </tr>
    </table>
</body>
</html>
