<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{   
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px; /* Largura*/
            height: 400px; /* Altura*/
            border-collapse: collapse; /* Tira os espaçamentos das bordar*/
        }


        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center; /* Alinhamento Horizontal - left/ center/ right */
            vertical-align: middle; /* Alinhamento Vertical - top/ middle/ bottom */
        }

        .numero {
            text-align: right; 
        }

    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>

    <!--
        HIERARQUIA DE TABELA (simples)     
        TABLE = tabela
            ↪TABLE ROWS <tr> = linha de tabela
                ↪TABLE HEADER <th> = Cabeçalho de tabela
                ↪TABLE DATA <td> = Dado de tabela
    -->
<table>
    <tr> <!-- Primeira linha-->
        <td>A1</td> <!--Dados-->
        <td>B1</td>
        <td>C1</td>
    </tr>
    <tr> <!-- Segunda linha-->
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>
    </tr>
    <tr> <!-- Terceira linha-->
        <td>A3</td>
        <td>B3</td>
        <td class="numero">C3</td>
    </tr>
    <tr> <!-- Quarta linha-->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
    </tr>
</table>
</body>
</html>
