<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{   
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
        }

        tr.linha {
            background-color: lightgray;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        td.dado {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>

    <!--
        HIERARQUIA DE TABELA (simples)     
        TABLE = tabela
            TABLE ROWS = linha de tabela
                TABLE HEADER = Cabeçalho de tabela
                TABLE DATA = Dado de tabela
    -->
<table>
    <tr> <!-- Primeira linha-->
        <td>A1</td> <!--Dados-->
        <td>B1</td>
        <td>C1</td>
    </tr>
    <tr class="linha"> <!-- Segunda linha-->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
    </tr>
    <tr> <!-- Terceira linha-->
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
    </tr>
    <tr> <!-- Quarta linha-->
        <td>A4</td>
        <td class="dado">B4</td>
        <td>C4</td>
    </tr>
    <tr class="linha">
        <td>A5</td>
        <td>B5</td>
    </tr>
    <tr>
        <td>A6</td>
    </tr>
</table>
</body>
</html>
