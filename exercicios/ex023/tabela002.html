<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            border-collapse: collapse; /* tira o espaçamento das bordar*/
            width: 500px
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color:gray;
            color: white;
        }
        .num {
            text-align: right;
        }


    </style>
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEARD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>    
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46.179.008</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.460.311</td>
            </tr>
            <tr>
                <td>Rio De Janeiro</td>
                <td class="num">17.225.410</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14 889 472</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11.952.456</td>
            </tr>
        </tbody>   
        <tfoot>
            <tr>
                
                <th>Total de Habitentes</th>
                <td class="num"><strong>0000</strong></td>
            
            </tr>
        </tfoot>
    </table>
</body>
</html>
