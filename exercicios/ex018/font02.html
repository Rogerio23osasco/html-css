<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face{
            font-family: 'love story'; 
            src: url('fontes/love story ttf.ttf'); format(truetype);
            font-weight: normal;
            font-style: normal;
        /* 
        tipos de format()
        -opentape (otf)
        -truetype (ttf)
        -embedded-opentype (eot)
        -truetape-aat (aple advanced typography)
        -svg
        */
        }

            
         body{
            font-family: Arial, Helvetica, sans-serif;

         }  

         h1{
            font-family: 'love story', 'Times New Roman', Times, serif;
            font-size: 3em;
            font-weight: normal;
         }      
    </style>
</head>
<body>
     <h1>olá, Mundo</h1>
     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consectetur quasi nobis ipsa nulla, non sint excepturi, quidem distinctio itaque at sapiente obcaecati ratione vero voluptatum harum? Optio, incidunt? Veritatis, expedita.</p>




</body>
</html>
